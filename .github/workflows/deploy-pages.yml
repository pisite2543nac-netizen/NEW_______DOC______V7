name: Deploy DOC-FULL-NR FINAL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Validate release
        run: |
          python tests/static_validation.py
          python tests/unified_contract.py
          python tests/button_contract.py
          python tests/course_code_contract.py
          python tests/branding_contract.py
          python tests/runtime_v173_contract.py
          python tests/learning_content_v174_contract.py
          python tests/v175_workpair_contract.py
          python tests/v176_fullset_contract.py
          python tests/v1761_icon_contract.py
          python tests/v177_transaction_contract.py
          python tests/v178_notification_contract.py
          python tests/v179_full_system_hardening_contract.py
          python tests/v181_complete_learning_system_contract.py
          python tests/v182_complete_system_final_contract.py
          python tests/v19_classroom_flow_contract.py
          python tests/v191_complete_user_requests_contract.py
          python tests/v1913_responsive_fit_contract.py
          python tests/v192_production_ux_contract.py
          python tests/v193_gradebook_contract.py
          python tests/v194_classroom_back_contract.py
          python tests/v195_exam_preset_contract.py
          python tests/v196_print_system_contract.py
          python tests/v197_programming_activity_contract.py
          python tests/v198_special_activity_hub_contract.py
          python tests/v199_detailed_teaching_slides_contract.py
          python tests/v200_teaching_presentation_unified_contract.py
          python tests/v201_content_focused_slides_contract.py
          python tests/v202_adaptive_mobile_camera_contract.py
          python tests/v203_mobile_interaction_camera_contract.py
          python tests/v204_real_device_mobile_router_contract.py
          python tests/v205_late_barcode_room_groups_contract.py
          python tests/v206_adaptive_stability_contract.py
          python tests/v207_long_term_ux_teacher_contract.py
          python tests/v210_major_stability_contract.py
          node --check site/app.js
          node --check site/camera-registration.js
          node --check site/device-camera-runtime.js
          node --check site/v16-platform.js
          node --check site/v16-7-hardening.js
          node --check site/v16-8-course-flow.js
          node --check site/v16-exam.js
          node --check site/v19-programming-activity.js
          node --check site/v21-runtime.js
          node --check site/sw.js
          node --check site/v18-supabase.js
          node --check site/v18-offline.js
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/course_code_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/real_use_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v181_core_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v186_room_work_checklist_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v187_exam_admin_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v187_exam_source_adaptation_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v1913_responsive_fit_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v192_production_ux_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v193_gradebook_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v196_print_system_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v197_programming_activity_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v198_special_activity_hub_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v199_detailed_teaching_slides_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v200_teaching_presentation_unified_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v201_content_focused_slides_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v202_adaptive_mobile_camera_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v203_mobile_interaction_camera_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v204_real_device_mobile_router_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v205_late_barcode_room_groups_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v206_adaptive_stability_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v207_long_term_ux_teacher_browser_contract.py
          DOCNR_RUN_BROWSER_CONTRACT=1 python tests/v210_major_stability_browser_contract.py
      - name: Decode PWA app icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -d site/icons/icon-48.png.b64 > site/icons/icon-48.png
          base64 -d site/icons/icon-180.png.b64 > site/icons/icon-180.png
          base64 -d site/icons/icon-192.png.b64 > site/icons/icon-192.png
          base64 -d site/icons/icon-512.png.b64 > site/icons/icon-512.png
          base64 -d site/icons/icon-maskable-512.png.b64 > site/icons/icon-maskable-512.png
          file site/icons/*.png
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production PWA
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
