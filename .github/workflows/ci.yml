name: DOC-FULL-NR V17 MASTER FLOW CI

on:
  pull_request:
  push:
    branches: [develop, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static production validation
        run: |
          python tests/static_validation.py
          python tests/unified_contract.py
          python tests/button_contract.py
          python tests/course_code_contract.py
          python tests/branding_contract.py
          python tests/runtime_v173_contract.py
          python tests/learning_content_v174_contract.py
          python tests/v175_workpair_contract.py
          python tests/v176_fullset_contract.py
          python tests/v1761_icon_contract.py
          python tests/v177_transaction_contract.py
          python tests/v178_notification_contract.py
      - name: JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/camera-registration.js
          node --check site/mobile.js
          node --check site/sw.js
          node --check site/v16-platform.js
          node --check site/v16-7-hardening.js
          node --check site/v16-8-course-flow.js
          node --check site/v16-exam.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function TypeScript check
        run: |
          deno check supabase/functions/register-user/index.ts
          deno check supabase/functions/register-user-camera/index.ts
          deno check supabase/functions/admin-create-user/index.ts
          deno check supabase/functions/admin-operations/index.ts
          deno check supabase/functions/bootstrap-admin/index.ts
