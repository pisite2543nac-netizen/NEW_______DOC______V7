name: DOC-FULL-NR V15 CI

on:
  pull_request:
  push:
    branches: [develop, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static production validation
        run: python tests/static_validation.py
      - name: JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/camera-registration.js
          node --check site/mobile.js
          node --check site/sw.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function TypeScript check
        run: |
          deno check supabase/functions/register-user/index.ts
          deno check supabase/functions/register-user-camera/index.ts
          deno check supabase/functions/admin-create-user/index.ts
          deno check supabase/functions/admin-operations/index.ts
