<!doctype html>
<html lang="th" class="v14-tech">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111f">
  <meta name="description" content="DOC-FULL-NR Exam Center - วิทยาลัยเทคนิคนางรอง">
  <title>Exam Center • DOC-FULL-NR</title>
  <link rel="stylesheet" href="./styles.css?v=20260911-v14-1">
  <link rel="stylesheet" href="./v14-tech.css?v=20260911-v14-1">
  <style>
    body{min-height:100vh}.exam-shell{max-width:1500px;margin:auto;padding:18px}.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.exam-brand{display:flex;align-items:center;gap:10px}.exam-logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#06b6d4,#2563eb 55%,#7c3aed);font-weight:900;color:#fff}.exam-main{display:grid;gap:14px}.exam-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.exam-card{border:1px solid #1e4c6d;border-radius:17px;padding:16px;background:linear-gradient(180deg,#0b2139,#07192b);display:grid;gap:8px}.exam-card h3{margin:2px 0}.exam-card small{color:#8ca9be}.exam-builder-q{border:1px solid #244f6c;border-radius:14px;padding:12px;background:#081b2e;display:grid;gap:9px}.exam-builder-q .grid{display:grid;grid-template-columns:1fr 160px 110px;gap:8px}.exam-attempt{max-width:1100px;margin:auto}.exam-workbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid #255675;border-radius:14px;background:rgba(5,20,34,.96);backdrop-filter:blur(12px)}.exam-timer{font-size:19px;font-weight:900;color:#67e8f9}.exam-timer.danger{color:#fb7185}.exam-question{border:1px solid #1d4b6b;border-radius:16px;padding:16px;background:#081d32;display:grid;gap:12px}.exam-question h3{margin:0}.exam-options{display:grid;gap:8px}.exam-option{display:flex;gap:9px;align-items:flex-start;border:1px solid #204b68;border-radius:11px;padding:10px;background:#0a2239;cursor:pointer}.exam-option:has(input:checked){border-color:#22d3ee;background:#0d3048}.exam-nav{display:flex;flex-wrap:wrap;gap:6px}.exam-nav button{width:38px;height:38px;padding:0}.exam-nav button.answered{background:#14532d;border-color:#22c55e}.exam-nav button.flagged{outline:2px solid #f59e0b}.exam-flag{justify-self:start}.exam-result{display:grid;place-items:center;text-align:center;min-height:360px}.exam-result strong{font-size:46px;color:#67e8f9}.exam-fullscreen-note{font-size:11px;color:#8ba8bc}.exam-admin-toolbar{display:flex;gap:8px;flex-wrap:wrap}.exam-answer-key{color:#86efac;font-size:12px}.exam-autosave{font-size:11px;color:#8ba8bc}.exam-hidden{display:none!important}@media(max-width:900px){.exam-grid{grid-template-columns:1fr 1fr}.exam-builder-q .grid{grid-template-columns:1fr}.exam-workbar{align-items:flex-start}.exam-top{align-items:flex-start}}@media(max-width:560px){.exam-shell{padding:9px}.exam-grid{grid-template-columns:1fr}.exam-top{display:grid}.exam-workbar{display:grid}.exam-timer{font-size:17px}.exam-question{padding:12px}}
  </style>
</head>
<body>
  <div class="exam-shell">
    <header class="exam-top">
      <div class="exam-brand"><div class="exam-logo">NR</div><div><b>DOC-FULL-NR Exam Center</b><div class="muted smalltext">ระบบสอบออนไลน์ • วิทยาลัยเทคนิคนางรอง</div></div></div>
      <div class="row"><span id="exam-user" class="muted"></span><a class="btn" href="./">← กลับระบบการเรียน</a></div>
    </header>
    <main id="exam-app" class="exam-main"><div class="v14-loading"><div class="v14-spinner"></div><b>กำลังเปิด Exam Center...</b></div></main>
  </div>
  <script type="module" src="./v14-exam.js?v=20260911-v14-1"></script>
</body>
</html>
